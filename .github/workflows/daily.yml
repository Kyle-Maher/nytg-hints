name: Daily Connections definitions

on:
  schedule:
    # 09:00 UTC ≈ 4-5am US/Eastern — safely after the midnight-ET puzzle drop.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD). Defaults to today in ET."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-connections
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate today's definitions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py ${{ github.event.inputs.date }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Connections definitions ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
